<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas de interfaz CCM/VDF</title><style>body{font:14px Arial;margin:12px}iframe{width:100%;height:1100px;border:1px solid #ccc}pre{white-space:pre-wrap}</style><h1>Pruebas de interfaz</h1><p>Ejecutar únicamente con un perfil temporal vacío. Los datos de prueba se conservan en ese perfil para inspección visual.</p><pre id="results">En ejecución…</pre><iframe src="../index.html" title="Dashboard de prueba"></iframe><script>
'use strict';
const output=document.querySelector('#results'),frame=document.querySelector('iframe'),messages=[],errors=[];
frame.addEventListener('load',async()=>{
 const w=frame.contentWindow,d=frame.contentDocument,M=w.CCM;
 w.addEventListener('error',event=>errors.push(event.message));w.addEventListener('unhandledrejection',event=>errors.push(String(event.reason)));
 const wait=()=>new Promise(resolve=>setTimeout(resolve,30));
 const assert=(ok,label)=>{if(!ok)throw new Error(label);messages.push('PASS '+label);output.textContent=messages.join('\n');};
 const click=selector=>{const node=d.querySelector(selector);if(!node)throw new Error('No existe: '+selector);node.click();};
 const set=(name,value)=>{const node=d.querySelector('#app-dialog [name="'+name+'"]');if(!node)throw new Error('Campo no encontrado: '+name);node.value=value;node.dispatchEvent(new w.Event('change',{bubbles:true}));};
 const submit=async()=>{const form=d.querySelector('#app-dialog form');if(!form.reportValidity())throw new Error('Formulario inválido: '+form.id);form.requestSubmit();for(let i=0;i<100;i++){await wait();if(!form.querySelector('[type="submit"]').disabled)break;}if(!d.querySelector('#dialog-error').hidden)throw new Error(d.querySelector('#dialog-error').textContent);};
 const read=()=>{const key=Object.keys(w.localStorage).find(key=>key.startsWith('ccm-vdf.project.v1.'));return key?JSON.parse(w.localStorage.getItem(key)):null;};
 const action=name=>click('[data-action="'+name+'"]');
 try {
  assert(!read(),'Perfil vacío y cartera inicial sin demostraciones');
  const directory=await w.navigator.storage.getDirectory();w.showDirectoryPicker=async()=>directory;click('#connect-folder');for(let i=0;i<100;i++){await wait();if(d.querySelector('#dialog-title').textContent==='Carpeta vinculada')break;}assert(d.querySelector('#dialog-title').textContent==='Carpeta vinculada','Vincular carpeta con API nativa (almacenamiento aislado de pruebas)');click('#close-dialog');
  const downloads=[];w.CCMStorage.download=(value,filename)=>downloads.push({value,filename});
  click('#new-project');set('client','COLLAHUASI');set('name','Expansión CCM/VDF');set('manager','Michelle');set('location','Región de Tarapacá, Chile');set('startDate','2026-09-17');set('targetDate','2026-09-30');set('technology','ccm_vdf');set('driveUrl','https://drive.google.com/drive/folders/carpeta-prueba');await submit();
  assert(read()?.checklist.length===145,'Crear proyecto vacío con 145 controles');assert(d.querySelectorAll('#checklist-rows tr').length===15,'Checklist paginado visible');assert(d.querySelector('#selected-project-title').textContent.includes('COLLAHUASI'),'Proyecto seleccionado');
  const initialFile=await (await directory.getFileHandle(read().id+'.json')).getFile();assert(JSON.parse(await initialFile.text()).id===read().id,'Un archivo JSON por proyecto escrito mediante la API nativa');
  click('#tab-documents');action('document-form');set('name','Unilineal Rev 0.pdf');set('path','Ingeniería/Unilineal Rev 0.pdf');set('familyId','unilineal');set('revision','0');set('readStatus','read');await submit();
  action('document-form');set('name','Unilineal Rev 1.pdf');set('path','Ingeniería/Unilineal Rev 1.pdf');set('familyId','unilineal');set('revision','1');set('readStatus','read');await submit();assert(read().documents.length===2,'Registrar ambas revisiones documentales');
  action('revision-form');set('fromDocumentId',read().documents[0].id);set('toDocumentId',read().documents[1].id);set('summary','La tensión nominal cambia de 380 V a 400 V.');set('justificationStatus','unknown');set('impact','Revisar selección de equipos.');await submit();assert(read().revisions[0].fromRevision==='0'&&read().revisions[0].toRevision==='1','Comparación conserva revisión de origen y destino');
  action('file-form');set('fileName','Unilineal Rev 1.pdf');set('path','Ingeniería/Unilineal Rev 1.pdf');set('driveFileId','drive-unilineal-1');set('url','https://drive.google.com/file/d/drive-unilineal-1/view');set('documentId',read().documents[1].id);set('modifiedTime','2026-09-20T10:00:00Z');set('sizeBytes','2048');set('version','12');set('processingStatus','processed');set('reason','Contenido completo revisado.');d.querySelector('[name="confirmProcessed"]').checked=true;await submit();assert(read().processedFiles.length===1&&w.CCMFiles.summary(read()).skip===1,'Registro procesado conserva carpeta, ruta y versión reutilizable');assert(d.querySelector('.file-registry').textContent.includes('Sin cambios registrados'),'Inventario visible con estado de comparación');
  click('[data-action="file-form"][data-id]');set('version','13');set('reason','Nuevo inventario de metadatos.');await submit();assert(read().processedFiles[0].processing.fingerprint.version==='12'&&w.CCMFiles.summary(read()).read===1,'Cambiar metadatos requiere leer y mantiene la huella anterior');action('file-reread');set('reason','Revisar todas las hojas.');await submit();assert(read().processedFiles[0].processing.forceReview,'Solicitud manual de relectura registrada');click('[data-action="file-form"][data-id]');d.querySelector('[name="confirmProcessed"]').checked=true;set('reason','Nueva lectura completa realizada.');await submit();assert(read().processedFiles[0].processing.fingerprint.version==='13'&&!read().processedFiles[0].processing.forceReview,'Nueva lectura confirmada actualiza versión y quita relectura');action('file-details');assert(d.querySelector('#dialog-content').textContent.includes('Última versión procesada'),'Consulta de metadatos procesados y observados');click('#close-dialog');
  click('#tab-diagnosis');const section=d.querySelector('#section-filter');section.value='3';section.dispatchEvent(new w.Event('change',{bubbles:true}));click('[data-action="checklist"][data-id="r3-01"]');set('state','available');set('value','400 V');set('reason','Verificado en la última revisión del unilineal.');
  d.querySelector('#form-checklist').requestSubmit();await wait();assert(!d.querySelector('#dialog-error').hidden,'No permite disponibilidad sin evidencia');
  action('add-evidence');const source=d.querySelector('[data-ev="documentId"]');source.value=read().documents[1].id;source.dispatchEvent(new w.Event('change',{bubbles:true}));d.querySelector('[data-ev="locator"]').value='Página 2, barra principal';d.querySelector('[data-ev="quote"]').value='Tensión nominal: 400 V';await submit();
  assert(read().checklist.find(x=>x.id==='r3-01').evidence[0].locator.includes('Página 2'),'Checklist conserva archivo, revisión y página');assert(read().checklist.find(x=>x.id==='r3-01').manualLock,'Ajuste manual protegido');action('evidence');assert(d.querySelector('#dialog-content').textContent.includes('Unilineal Rev 1.pdf'),'El origen puede consultarse desde la tabla');click('#close-dialog');
  click('#tab-queries');action('query-form');set('title','Confirmar corriente de cortocircuito');set('question','¿Cuál es la corriente de cortocircuito en la barra?');set('assignedTo','Ingeniería del cliente');set('relatedChecklistId','r3-04');await submit();action('query-detail');set('transition','closed');set('body','El cliente confirmó 50 kA mediante correo.');await submit();assert(read().queries[0].status==='closed'&&read().queries[0].messages.length===1,'Cerrar consulta con resolución trazable');click('#close-dialog');click('[data-query-filter="closed"]');assert(d.querySelectorAll('.query-card').length===1,'Filtro de consultas cerradas');action('query-detail');set('body','Confirmar duración de la corriente.');await submit();assert(read().queries[0].status==='open'&&read().queries[0].messages.length===2,'Reabrir conserva la resolución anterior');click('#close-dialog');
  click('#tab-team');action('team-form');set('name','Michelle');set('role','Ingeniera de proyectos');set('company','CCM/VDF');set('phone','+56 9 1234 5678');set('email','michelle@example.com');await submit();assert(read().team[0].company==='CCM/VDF','Equipo conserva contacto y empresa');
  click('#tab-history');action('note-form');set('body','Se acuerda revisar la arquitectura de control.');await submit();assert(read().history.at(-1).kind==='note.added','Registro manual en historial');
  click('#tab-summary');action('calendar');action('holiday-form');set('date','2026-09-22');set('name','Suspensión local de prueba');set('scope','local');set('source','Acuerdo de prueba');await submit();assert(read().calendar.holidays.some(x=>x.date==='2026-09-22'),'Feriado local guardado por proyecto');click('#close-dialog');
  action('ai-workflow');assert(d.querySelector('#pipeline-prompt').value.includes(read().id),'Mensaje del pipeline identifica el proyecto y la carpeta');action('manual-ai-workflow');action('export-review');await wait();assert(downloads.at(-1).value.reviewContext.baseVersion===read().version,'Exportar JSON padre con versión base de revisión');click('#close-dialog');
  assert(downloads.at(-1).value.processedFiles[0].path==='Ingeniería/Unilineal Rev 1.pdf','JSON para el chat incluye inventario y rutas de Drive');
  const incoming=downloads.at(-1).value;incoming.analysis.provider='Gemini';incoming.analysis.summary='Revisión simulada para validar la importación';incoming.analysis.coverage.discovered=2;incoming.analysis.coverage.read=2;incoming.checklist.find(x=>x.id==='r3-01').value='480 V';incoming.checklist.find(x=>x.id==='r1-01').state='missing';
  const transfer=new w.DataTransfer();transfer.items.add(new w.File([JSON.stringify(incoming)],'revision-ia.json',{type:'application/json'}));const upload=d.querySelector('#json-file-input');upload.files=transfer.files;upload.dispatchEvent(new w.Event('change',{bubbles:true}));for(let i=0;i<100;i++){await wait();if(d.querySelector('#form-apply-review'))break;}assert(!d.querySelector('[name="change"][value="checklist:r3-01"]').checked,'Revisión IA desmarca cambio sobre dato manual');await submit();assert(read().checklist.find(x=>x.id==='r3-01').value==='400 V','Aplicar revisión conserva ajuste protegido');assert(read().checklist.find(x=>x.id==='r1-01').state==='missing'&&read().reviews.length===1,'Acepta cambios seleccionados y registra revisión');

  const beforeAutomation=read(),automaticInput=await M.prepareReview(beforeAutomation);automaticInput.analysis.provider='Agente de prueba';automaticInput.analysis.reviewedAt=M.now();automaticInput.analysis.coverage.folderUrl=beforeAutomation.info.driveUrl;automaticInput.checklist.find(x=>x.id==='r1-02').state='missing';automaticInput.checklist.find(x=>x.id==='r1-02').notes='Revisión automática simulada.';
  const automatic=M.applyAutomaticReview(beforeAutomation,await M.compareReview(beforeAutomation,automaticInput));
  const externalHandle=await directory.getFileHandle(automatic.id+'.json');const externalWrite=await externalHandle.createWritable();await externalWrite.write(JSON.stringify(automatic));await externalWrite.close();
  for(let i=0;i<240;i++){await wait();if(read().version===automatic.version)break;}
  assert(read().version===automatic.version&&read().checklist.find(x=>x.id==='r1-02').state==='missing','La carpeta se recarga automáticamente sin importar el JSON');
  click('#tab-history');assert(d.querySelector('#project-panel').textContent.includes('Actualización automática de IA'),'Historial distingue actualización automática de aprobación humana');
  const locked=await directory.getFileHandle(automatic.id+'.lock',{create:true});const lockWrite=await locked.createWritable();await lockWrite.write('{}');await lockWrite.close();
  action('note-form');set('body','No debe guardarse durante revisión');d.querySelector('#form-note').requestSubmit();for(let i=0;i<100;i++){await wait();if(!d.querySelector('#dialog-error').hidden)break;}
  assert(d.querySelector('#dialog-error').textContent.includes('agente')&&read().version===automatic.version,'Bloqueo de revisión evita guardar una edición manual');await directory.removeEntry(automatic.id+'.lock');click('#close-dialog');
  action('note-form');set('body','Edición abierta antes de cambio externo');
  const newer=M.addNote(read(),'Cambio posterior de archivo',[],'Agente de prueba'),nw=await externalHandle.createWritable();await nw.write(JSON.stringify(newer));await nw.close();w.dispatchEvent(new w.Event('focus'));for(let i=0;i<100;i++){await wait();if(read().version===newer.version)break;}
  d.querySelector('#form-note').requestSubmit();await wait();assert(d.querySelector('#dialog-error').textContent.includes('cambió mientras editabas'),'Formulario obsoleto conserva actualización externa');click('#close-dialog');
  action('note-form');set('body','Edición durante cambio todavía no detectado');
  const concurrent=M.addNote(read(),'Cambio detectado al guardar',[],'Agente de prueba'),cw=await externalHandle.createWritable();await cw.write(JSON.stringify(concurrent));await cw.close();
  d.querySelector('#form-note').requestSubmit();for(let i=0;i<100;i++){await wait();if(!d.querySelector('#dialog-error').hidden)break;}
  assert(read().version===concurrent.version&&!d.querySelector('#dialog-error').hidden,'Comprobación antes de guardar detecta cambio externo sin sobrescribirlo');click('#close-dialog');
  action('note-form');set('body','Nuevo intento sobre versión actual');await submit();assert(read().version===concurrent.version+1,'La vista conserva la nueva versión después de un conflicto al guardar');
  click('#tab-summary');
  action('close-project');set('date','2026-09-21');set('reason','Propuesta enviada al cliente.');await submit();assert(read().lifecycle.closure.calculation.days===1,'Cierre guarda un día hábil excluyendo 18 y 19 de septiembre y domingo');assert(downloads.at(-1).value.lifecycle.status==='closed','Cierre exporta JSON completo');assert(!d.querySelector('[data-action="edit-project"]'),'Proyecto cerrado sin acciones de edición');
  action('reopen-project');set('reason','Cliente solicita ajuste.');await submit();assert(read().lifecycle.status==='active','Reapertura disponible desde la ficha');
  click('#tab-diagnosis');action('next-page');assert(d.querySelector('#checklist-rows .item-id').textContent==='r2-04','Paginación avanza a los siguientes controles');
  for(const tab of ['summary','documents','queries','team','history','diagnosis'])click('#tab-'+tab);
  assert(!errors.length,'Sin errores de JavaScript: '+errors.join('; '));assert(d.documentElement.scrollWidth<=w.innerWidth+1,'Sin desborde horizontal en la página');
  const savedFile=await (await directory.getFileHandle(read().id+'.json')).getFile();assert(JSON.parse(await savedFile.text()).version===read().version,'El JSON de la carpeta refleja la última versión tras reabrir');
  const snapshot=read();w.location.reload();await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));assert(frame.contentDocument.querySelector('#selected-project-title').textContent.includes('COLLAHUASI'),'Persistencia al recargar');assert(JSON.parse(w.localStorage.getItem('ccm-vdf.project.v1.'+snapshot.id)).version===snapshot.version,'La recarga conserva la versión guardada');
  document.body.dataset.result='PASS';output.textContent=messages.join('\n')+'\nALL PASSED';
 }catch(error){document.body.dataset.result='FAIL';output.textContent=messages.join('\n')+'\nFAIL '+error.stack;}
},{once:true});
</script></html>
